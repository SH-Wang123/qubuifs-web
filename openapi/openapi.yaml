openapi: 3.0.0
info:
  title: QubuiFS Management API
  version: 1.0.0
servers:
- url: http://localhost:9983
  description: Local management REST server
tags:
- name: System
  description: Control-plane health and version APIs
- name: QubuiFS
  description: Filesystem lifecycle APIs
- name: Node
  description: Node registration and status APIs
- name: DataDevice
  description: Data device management APIs
- name: Metadata
  description: Control-plane metadata APIs
- name: MetaService
  description: Metadata service and runtime instance lifecycle APIs
paths:
  /healthz:
    get:
      tags:
      - System
      summary: Health check
      operationId: GetHealthz
      description: Return process liveness for the control-plane REST service.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                          - ok
                      required:
                      - status
  /readyz:
    get:
      tags:
      - System
      summary: Readiness check
      operationId: GetReadyz
      description: Return whether the control plane has completed initialization and
        can serve management requests.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        ready:
                          type: boolean
                        reason:
                          type: string
                      required:
                      - ready
  /version:
    get:
      tags:
      - System
      summary: Version
      operationId: GetVersion
      description: Return control-plane build and version information.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        version:
                          type: string
                        git_commit:
                          type: string
                        build_time:
                          type: string
                      required:
                      - version
  /images/catalog:
    get:
      tags:
      - System
      summary: List component image versions
      operationId: GetImageCatalog
      description: Return available image versions for every deployable QubuiFS component.
        Components without published images return an empty array.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        meta:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                        data:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                        control_plane:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                        client:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                      required:
                      - meta
                      - data
                      - control_plane
                      - client
  /qubuifs:
    get:
      summary: List QubuiFS
      operationId: ListQubuiFS
      description: List the managed QubuiFS instances known to the control plane.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        filesystems:
                          type: object
                          description: Complete metadata map keyed by namespace and
                            then fs_uuid.
                          additionalProperties:
                            type: object
                            additionalProperties:
                              type: object
                              additionalProperties: false
                              description: REST representation of pb.QubuiFS.
                              properties:
                                fs_uuid:
                                  type: string
                                  description: pb.QubuiFS.fs_uuid.
                                fs_id:
                                  type: integer
                                  format: int64
                                  description: pb.QubuiFS.fs_id.
                                disk_labels:
                                  type: array
                                  description: pb.QubuiFS.disk_labels.
                                  items:
                                    type: object
                                    additionalProperties: false
                                    description: REST representation of pb.DiskLabel.
                                    properties:
                                      fs_uuid:
                                        type: string
                                      device_uuid:
                                        type: string
                                      qfs_prefix:
                                        type: integer
                                        format: int64
                                        x-go-type: uint64
                                        minimum: 0
                                      idx:
                                        type: integer
                                        format: int32
                                        x-go-type: uint32
                                        minimum: 0
                                namespace:
                                  type: string
                                  description: pb.QubuiFS.namespace.
                                mount_info:
                                  type: array
                                  description: pb.QubuiFS.mount_info.
                                  items:
                                    type: object
                                    additionalProperties: false
                                    description: REST representation of pb.MountInfo.
                                    properties:
                                      path:
                                        type: string
                                      node_id:
                                        type: string
                                    required:
                                    - path
                                    - node_id
                                meta_node_id:
                                  type: array
                                  description: pb.QubuiFS.meta_node_id.
                                  items:
                                    type: string
                                data_node_id:
                                  type: array
                                  description: pb.QubuiFS.data_node_id.
                                  items:
                                    type: string
                              required:
                              - fs_uuid
                              - namespace
                        count:
                          type: integer
                          description: Total number of filesystems across all namespaces.
                          minimum: 0
                      required:
                      - filesystems
                      - count
    post:
      summary: Create QubuiFS
      operationId: CreateQubuiFS
      description: Create a QubuiFS instance from required control-plane metadata.
      tags:
      - QubuiFS
      requestBody:
        required: true
        description: Required metadata used by the REST layer to build pb.QubuiFS.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Create request for QubuiFS. The REST layer builds pb.QubuiFS
                from these required fields.
              properties:
                namespace:
                  type: string
                  description: pb.QubuiFS.namespace.
                disk_labels:
                  type: array
                  description: Existing devices selected for the filesystem. fs_uuid
                    and idx are generated by the control plane.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      device_uuid:
                        type: string
                        minLength: 1
                      qfs_prefix:
                        type: integer
                        format: int64
                        x-go-type: uint64
                        minimum: 1
                    required:
                    - device_uuid
                    - qfs_prefix
                  minItems: 1
                meta_node_id:
                  type: array
                  description: pb.QubuiFS.meta_node_id.
                  items:
                    type: string
                  minItems: 1
                data_node_id:
                  type: array
                  description: pb.QubuiFS.data_node_id.
                  items:
                    type: string
                  minItems: 1
              required:
              - namespace
              - disk_labels
              - meta_node_id
              - data_node_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        fs_uuid:
                          type: string
                      required:
                      - fs_uuid
  /qubuifs/{fs_uuid}:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get QubuiFS
      operationId: GetQubuiFS
      description: Get one managed QubuiFS instance by fs_uuid.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: REST representation of pb.QubuiFS.
                      properties:
                        fs_uuid:
                          type: string
                          description: pb.QubuiFS.fs_uuid.
                        fs_id:
                          type: integer
                          format: int64
                          description: pb.QubuiFS.fs_id.
                        disk_labels:
                          type: array
                          description: pb.QubuiFS.disk_labels.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.DiskLabel.
                            properties:
                              fs_uuid:
                                type: string
                              device_uuid:
                                type: string
                              qfs_prefix:
                                type: integer
                                format: int64
                                x-go-type: uint64
                                minimum: 0
                              idx:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                        namespace:
                          type: string
                          description: pb.QubuiFS.namespace.
                        mount_info:
                          type: array
                          description: pb.QubuiFS.mount_info.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.MountInfo.
                            properties:
                              path:
                                type: string
                              node_id:
                                type: string
                            required:
                            - path
                            - node_id
                        meta_node_id:
                          type: array
                          description: pb.QubuiFS.meta_node_id.
                          items:
                            type: string
                        data_node_id:
                          type: array
                          description: pb.QubuiFS.data_node_id.
                          items:
                            type: string
                      required:
                      - fs_uuid
                      - namespace
    delete:
      summary: Delete QubuiFS
      operationId: DeleteQubuiFS
      description: Unmount and remove one managed QubuiFS instance by fs_uuid.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    description: Application status code. Zero means success.
                  message:
                    type: string
                  data:
                    nullable: true
                    description: Operation-specific response payload.
                required:
                - code
                - message
  /qubuifs/{fs_uuid}/topology/register:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - QubuiFS
      summary: Register QubuiFS topology node
      operationId: RegisterQubuiFSTopologyNode
      description: Register one node into the topology of a specific QubuiFS.
      requestBody:
        required: true
        description: Namespace and node_id used to register one node. fs_uuid is taken
          from the path.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Request for registering or unregistering one node in a
                specific QubuiFS topology. fs_uuid comes from the path.
              properties:
                namespace:
                  type: string
                  description: pb.QubuiFS.namespace.
                node_id:
                  type: string
                  description: pb.CrushNode.node_id.
              required:
              - namespace
              - node_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        namespace:
                          type: string
                        fs_uuid:
                          type: string
                        node_id:
                          type: string
                      required:
                      - namespace
                      - fs_uuid
                      - node_id
    delete:
      tags:
      - QubuiFS
      summary: Unregister QubuiFS topology node
      operationId: UnregisterQubuiFSTopologyNode
      description: Unregister one node from the topology of a specific QubuiFS.
      requestBody:
        required: true
        description: Namespace and node_id used to unregister one node. fs_uuid is
          taken from the path.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Request for registering or unregistering one node in a
                specific QubuiFS topology. fs_uuid comes from the path.
              properties:
                namespace:
                  type: string
                  description: pb.QubuiFS.namespace.
                node_id:
                  type: string
                  description: pb.CrushNode.node_id.
              required:
              - namespace
              - node_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        namespace:
                          type: string
                        fs_uuid:
                          type: string
                        node_id:
                          type: string
                      required:
                      - namespace
                      - fs_uuid
                      - node_id
  /nodes:
    get:
      tags:
      - Node
      summary: List nodes
      operationId: ListNodes
      description: List registered control-plane topology nodes.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        nodes:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.CrushNode.
                            properties:
                              node_id:
                                type: string
                              type:
                                type: integer
                                format: int32
                                description: pb.NodeType enum value.
                                enum:
                                - 0
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                                - 6
                                - 7
                                - 8
                              parent_node_id:
                                type: string
                              children:
                                type: array
                                items:
                                  type: string
                              weight:
                                type: integer
                                format: int64
                                x-go-type: uint64
                                minimum: 0
                              state:
                                type: integer
                                format: int32
                                description: pb.InOutState enum value.
                                enum:
                                - 0
                                - 1
                                - 2
                              reweight:
                                type: number
                                format: double
                                minimum: 0
                                maximum: 1
                              device:
                                type: array
                                items:
                                  type: object
                                  additionalProperties: false
                                  description: REST representation of pb.DeviceInfo.
                                  properties:
                                    device_uuid:
                                      type: string
                                    qfs_prefix:
                                      type: integer
                                      format: int64
                                      x-go-type: uint64
                                      minimum: 0
                                    class:
                                      type: integer
                                      format: int32
                                      description: pb.DeviceClass enum value.
                                      enum:
                                      - 0
                                      - 1
                                      - 2
                                      - 3
                                    super_block:
                                      type: object
                                      additionalProperties: false
                                      description: REST representation of pb.SuperBlock.
                                      properties:
                                        disk_label:
                                          type: object
                                          additionalProperties: false
                                          description: REST representation of pb.DiskLabel.
                                          properties:
                                            fs_uuid:
                                              type: string
                                            device_uuid:
                                              type: string
                                            qfs_prefix:
                                              type: integer
                                              format: int64
                                              x-go-type: uint64
                                              minimum: 0
                                            idx:
                                              type: integer
                                              format: int32
                                              x-go-type: uint32
                                              minimum: 0
                                        version:
                                          type: integer
                                          format: int32
                                          x-go-type: uint32
                                          minimum: 0
                                        magic_num:
                                          type: integer
                                          format: int64
                                          x-go-type: uint64
                                          minimum: 0
                                        checksum:
                                          type: integer
                                          format: int32
                                          x-go-type: uint32
                                          minimum: 0
                                        size:
                                          type: integer
                                          format: int64
                                          x-go-type: uint64
                                          minimum: 0
                                        io_size:
                                          type: integer
                                          format: int32
                                          x-go-type: uint32
                                          minimum: 0
                                        access:
                                          type: integer
                                          format: int32
                                          x-go-type: uint32
                                          minimum: 0
                                        block_size:
                                          type: integer
                                          format: int32
                                          x-go-type: uint32
                                          minimum: 0
                                        dir_len:
                                          type: integer
                                          format: int32
                                          x-go-type: uint32
                                          minimum: 0
                                        epoch_head:
                                          type: integer
                                          format: int64
                                          x-go-type: uint64
                                          minimum: 0
                                        generation:
                                          type: integer
                                          format: int64
                                          x-go-type: uint64
                                          minimum: 0
                                    cap:
                                      type: integer
                                      format: int64
                                      x-go-type: uint64
                                      minimum: 0
                                    phy_path:
                                      type: string
                                    devType:
                                      type: integer
                                      format: int32
                                      x-go-name: DevType
                                      description: pb.DeviceInfo.devType.
                                  required:
                                  - phy_path
                                  - devType
                              tags:
                                type: object
                                additionalProperties:
                                  type: string
                              addr:
                                type: string
                              qdp_port:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                              data_rpc_port:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                              meta_rpc_port:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                              des:
                                type: string
                              role:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                                description: Bitmask using pb.NodeRole values.
                              fs_uuid_list:
                                type: array
                                items:
                                  type: string
                              version:
                                type: string
                              namespace:
                                type: string
                            required:
                            - node_id
                            - type
                            - parent_node_id
                            - state
                            - addr
                            - role
                        count:
                          type: integer
                          minimum: 0
                      required:
                      - nodes
                      - count
    post:
      tags:
      - Node
      summary: Add node
      operationId: AddNode
      description: Add a node resource. The control plane generates node_id and initializes
        topology/runtime state.
      requestBody:
        required: true
        description: User-supplied node connection and role information.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Node registration input. The control plane generates node_id
                and owns runtime/topology state.
              properties:
                addr:
                  type: string
                  minLength: 1
                  description: Node network address or resolvable host name.
                role:
                  type: integer
                  format: int32
                  x-go-type: uint32
                  description: Non-zero bitmask composed from META=1, DATA=2 and CONTROL=4.
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
                parent_node_id:
                  type: string
                  description: Optional parent topology node. Defaults to the virtual
                    root.
                qdp_port:
                  type: integer
                  format: int32
                  x-go-type: uint32
                  minimum: 1
                  maximum: 65535
                data_rpc_port:
                  type: integer
                  format: int32
                  x-go-type: uint32
                  minimum: 1
                  maximum: 65535
                meta_rpc_port:
                  type: integer
                  format: int32
                  x-go-type: uint32
                  minimum: 1
                  maximum: 65535
                tags:
                  type: object
                  additionalProperties:
                    type: string
                des:
                  type: string
                namespace:
                  type: string
                  description: Optional initial namespace association.
              required:
              - addr
              - role
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        node_id:
                          type: string
                        endpoint:
                          type: string
                      required:
                      - node_id
                      - endpoint
  /nodes/{node_id}:
    parameters:
