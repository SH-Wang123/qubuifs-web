                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        description: Minimal Kubernetes node information exposed for
                          DataNode placement.
                        properties:
                          name:
                            type: string
                          qubuifs_node:
                            type: boolean
                            description: Whether the Kubernetes node has qubuifs.io/data-node=true.
                          architecture:
                            type: string
                            description: CPU architecture reported by Kubernetes,
                              for example amd64 or arm64.
                        required:
                        - name
                        - qubuifs_node
                        - architecture
    post:
      tags:
      - Cluster
      summary: Deploy DataNode
      operationId: DeployDataNode
      description: Create or reconcile one DataNode Pod on a selected Kubernetes node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: DataNode Pod deployment target and published image version.
              properties:
                node:
                  type: string
                  minLength: 1
                  description: Name of the Kubernetes node that will host the DataNode
                    Pod.
