openapi: 3.0.0
info:
  title: QubuiFS Management API
  version: 1.0.0
servers:
- url: http://localhost:9983
  description: Local management REST server
tags:
- name: System
  description: Control-plane health and version APIs
- name: QubuiFS
  description: Filesystem lifecycle APIs
- name: DataNode
  description: DataNode status and device APIs
- name: Cluster
  description: Kubernetes cluster inventory APIs
- name: DataDevice
  description: Data device management APIs
- name: Metadata
  description: Control-plane metadata APIs
- name: Namespace
  description: QubuiFS namespace lifecycle APIs
- name: MetaService
  description: Metadata service and runtime instance lifecycle APIs
paths:
  /healthz:
    get:
      tags:
      - System
      summary: Health check
      operationId: GetHealthz
      description: Return process liveness for the control-plane REST service.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        status:
                          type: string
                          enum:
                          - ok
                      required:
                      - status
  /readyz:
    get:
      tags:
      - System
      summary: Readiness check
      operationId: GetReadyz
      description: Return whether the control plane has completed initialization and
        can serve management requests.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        ready:
                          type: boolean
                        reason:
                          type: string
                      required:
                      - ready
  /version:
    get:
      tags:
      - System
      summary: Version
      operationId: GetVersion
      description: Return control-plane build and version information.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        version:
                          type: string
                        git_commit:
                          type: string
                        build_time:
                          type: string
                      required:
                      - version
  /images/catalog:
    get:
      tags:
      - System
      summary: List component image versions
      operationId: GetImageCatalog
      description: Return available image versions for every deployable QubuiFS component.
        Components without published images return an empty array.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        meta:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                        data:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                        control_plane:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                        client:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              version:
                                type: string
                                description: Published image tag.
                              image:
                                type: string
                                description: Fully qualified image reference using
                                  the published tag.
                              digest:
                                type: string
                                description: Immutable OCI image digest.
                              pushed_at:
                                type: string
                                format: date-time
                                description: Time the artifact was pushed to the image
                                  registry.
                            required:
                            - version
                            - image
                            - digest
                      required:
                      - meta
                      - data
                      - control_plane
                      - client
  /qubuifs:
    get:
      summary: List QubuiFS
      operationId: ListQubuiFS
      description: List the managed QubuiFS instances known to the control plane.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        filesystems:
                          type: object
                          description: Complete metadata map keyed by namespace and
                            then fs_uuid.
                          additionalProperties:
                            type: object
                            additionalProperties:
                              type: object
                              additionalProperties: false
                              description: REST representation of pb.QubuiFS.
                              properties:
                                fs_uuid:
                                  type: string
                                  description: pb.QubuiFS.fs_uuid.
                                fs_id:
                                  type: integer
                                  format: int64
                                  description: pb.QubuiFS.fs_id.
                                disk_labels:
                                  type: array
                                  description: pb.QubuiFS.disk_labels.
                                  items:
                                    type: object
                                    additionalProperties: false
                                    description: REST representation of pb.DiskLabel.
                                    properties:
                                      fs_uuid:
                                        type: string
                                      device_uuid:
                                        type: string
                                      qfs_prefix:
                                        type: integer
                                        format: int64
                                        x-go-type: uint64
                                        minimum: 0
                                      idx:
                                        type: integer
                                        format: int32
                                        x-go-type: uint32
                                        minimum: 0
                                namespace:
                                  type: string
                                  description: pb.QubuiFS.namespace.
                                name:
                                  type: string
                                  description: pb.QubuiFS.name.
                                des:
                                  type: string
                                  description: pb.QubuiFS.des.
                                mount_info:
                                  type: array
                                  description: pb.QubuiFS.mount_info.
                                  items:
                                    type: object
                                    additionalProperties: false
                                    description: REST representation of pb.MountInfo.
                                    properties:
                                      path:
                                        type: string
                                      node_id:
                                        type: string
                                    required:
                                    - path
                                    - node_id
                                meta_service_id:
                                  type: array
                                  description: Metadata services associated with this
                                    QubuiFS.
                                  items:
                                    type: string
                                data_node_id:
                                  type: array
                                  description: pb.QubuiFS.data_node_id.
                                  items:
                                    type: string
                              required:
                              - fs_uuid
                              - namespace
                        count:
                          type: integer
                          description: Total number of filesystems across all namespaces.
                          minimum: 0
                      required:
                      - filesystems
                      - count
    post:
      summary: Create QubuiFS
      operationId: CreateQubuiFS
      description: Create a QubuiFS instance from required control-plane metadata.
      tags:
      - QubuiFS
      requestBody:
        required: true
        description: Required metadata used by the REST layer to build pb.QubuiFS.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Create request for QubuiFS. The REST layer builds pb.QubuiFS
                from these required fields.
              properties:
                namespace:
                  type: string
                  description: pb.QubuiFS.namespace.
                name:
                  type: string
                  minLength: 1
                  description: Display name for this QubuiFS.
                des:
                  type: string
                  description: Optional description for this QubuiFS.
                meta_service_id:
                  type: array
                  minItems: 1
                  description: Existing metadata services used by this QubuiFS.
                  items:
                    type: string
                    minLength: 1
                data_node_id:
                  type: array
                  description: Optional pb.QubuiFS.data_node_id values.
                  items:
                    type: string
              required:
              - namespace
              - name
              - meta_service_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        fs_uuid:
                          type: string
                      required:
                      - fs_uuid
  /qubuifs/{fs_uuid}:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get QubuiFS
      operationId: GetQubuiFS
      description: Get one managed QubuiFS instance by fs_uuid.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: REST representation of pb.QubuiFS.
                      properties:
                        fs_uuid:
                          type: string
                          description: pb.QubuiFS.fs_uuid.
                        fs_id:
                          type: integer
                          format: int64
                          description: pb.QubuiFS.fs_id.
                        disk_labels:
                          type: array
                          description: pb.QubuiFS.disk_labels.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.DiskLabel.
                            properties:
                              fs_uuid:
                                type: string
                              device_uuid:
                                type: string
                              qfs_prefix:
                                type: integer
                                format: int64
                                x-go-type: uint64
                                minimum: 0
                              idx:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                        namespace:
                          type: string
                          description: pb.QubuiFS.namespace.
                        name:
                          type: string
                          description: pb.QubuiFS.name.
                        des:
                          type: string
                          description: pb.QubuiFS.des.
                        mount_info:
                          type: array
                          description: pb.QubuiFS.mount_info.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.MountInfo.
                            properties:
                              path:
                                type: string
                              node_id:
                                type: string
                            required:
                            - path
                            - node_id
                        meta_service_id:
                          type: array
                          description: Metadata services associated with this QubuiFS.
                          items:
                            type: string
                        data_node_id:
                          type: array
                          description: pb.QubuiFS.data_node_id.
                          items:
                            type: string
                      required:
                      - fs_uuid
                      - namespace
    delete:
      summary: Delete QubuiFS
      operationId: DeleteQubuiFS
      description: Unmount and remove one managed QubuiFS instance by fs_uuid.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    description: Application status code. Zero means success.
                  message:
                    type: string
                  data:
                    nullable: true
                    description: Operation-specific response payload.
                required:
                - code
                - message
  /qubuifs/{fs_uuid}/test:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      description: Filesystem identifier to test.
      schema:
        type: string
        minLength: 1
    get:
      summary: Test QubuiFS
      operationId: TestQubuiFS
      description: Run the management-plane test hook for one QubuiFS. The concrete
        ControlAdminService test is currently a placeholder.
      tags:
      - QubuiFS
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: true
                      description: Reserved result payload for the QubuiFS test hook.
                      properties:
                        fs_uuid:
                          type: string
                        status:
                          type: string
        '501':
          description: Test hook is not implemented yet.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    description: Application status code. Zero means success.
                  message:
                    type: string
                  data:
                    nullable: true
                    description: Operation-specific response payload.
                required:
                - code
                - message
  /qubuifs/{fs_uuid}/topology/register:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - QubuiFS
      summary: Register QubuiFS topology node
      operationId: RegisterQubuiFSTopologyNode
      description: Register one node into the topology of a specific QubuiFS.
      requestBody:
        required: true
        description: Namespace and node_id used to register one node. fs_uuid is taken
          from the path.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Request for registering or unregistering one node in a
                specific QubuiFS topology. fs_uuid comes from the path.
              properties:
                namespace:
                  type: string
                  description: pb.QubuiFS.namespace.
                node_id:
                  type: string
                  description: pb.CrushNode.node_id.
              required:
              - namespace
              - node_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        namespace:
                          type: string
                        fs_uuid:
                          type: string
                        node_id:
                          type: string
                      required:
                      - namespace
                      - fs_uuid
                      - node_id
    delete:
      tags:
      - QubuiFS
      summary: Unregister QubuiFS topology node
      operationId: UnregisterQubuiFSTopologyNode
      description: Unregister one node from the topology of a specific QubuiFS.
      requestBody:
        required: true
        description: Namespace and node_id used to unregister one node. fs_uuid is
          taken from the path.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Request for registering or unregistering one node in a
                specific QubuiFS topology. fs_uuid comes from the path.
              properties:
                namespace:
                  type: string
                  description: pb.QubuiFS.namespace.
                node_id:
                  type: string
                  description: pb.CrushNode.node_id.
              required:
              - namespace
              - node_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        namespace:
                          type: string
                        fs_uuid:
                          type: string
                        node_id:
                          type: string
                      required:
                      - namespace
                      - fs_uuid
                      - node_id
  /qubuifs/{fs_uuid}/data-nodes:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      tags:
      - QubuiFS
      summary: Add data node to QubuiFS
      operationId: AddQubuiFSDataNode
      description: Add an existing etcd-registered node ID to the filesystem data
        node list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                node_id:
                  type: string
                  minLength: 1
                  description: Node ID that must already exist in etcd.
              required:
              - node_id
      responses:
        '200':
          description: Data node added
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: REST representation of pb.QubuiFS.
                      properties:
                        fs_uuid:
                          type: string
                          description: pb.QubuiFS.fs_uuid.
                        fs_id:
                          type: integer
                          format: int64
                          description: pb.QubuiFS.fs_id.
                        disk_labels:
                          type: array
                          description: pb.QubuiFS.disk_labels.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.DiskLabel.
                            properties:
                              fs_uuid:
                                type: string
                              device_uuid:
                                type: string
                              qfs_prefix:
                                type: integer
                                format: int64
                                x-go-type: uint64
                                minimum: 0
                              idx:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                        namespace:
                          type: string
                          description: pb.QubuiFS.namespace.
                        name:
                          type: string
                          description: pb.QubuiFS.name.
                        des:
                          type: string
                          description: pb.QubuiFS.des.
                        mount_info:
                          type: array
                          description: pb.QubuiFS.mount_info.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.MountInfo.
                            properties:
                              path:
                                type: string
                              node_id:
                                type: string
                            required:
                            - path
                            - node_id
                        meta_service_id:
                          type: array
                          description: Metadata services associated with this QubuiFS.
                          items:
                            type: string
                        data_node_id:
                          type: array
                          description: pb.QubuiFS.data_node_id.
                          items:
                            type: string
                      required:
                      - fs_uuid
                      - namespace
    delete:
      tags:
      - QubuiFS
      summary: Delete data node from QubuiFS
      operationId: DeleteQubuiFSDataNode
      description: Delete an etcd-registered node ID from the filesystem data node
        list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                node_id:
                  type: string
                  minLength: 1
                  description: Node ID that must already exist in etcd.
              required:
              - node_id
      responses:
        '200':
          description: Data node deleted
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      description: REST representation of pb.QubuiFS.
                      properties:
                        fs_uuid:
                          type: string
                          description: pb.QubuiFS.fs_uuid.
                        fs_id:
                          type: integer
                          format: int64
                          description: pb.QubuiFS.fs_id.
                        disk_labels:
                          type: array
                          description: pb.QubuiFS.disk_labels.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.DiskLabel.
                            properties:
                              fs_uuid:
                                type: string
                              device_uuid:
                                type: string
                              qfs_prefix:
                                type: integer
                                format: int64
                                x-go-type: uint64
                                minimum: 0
                              idx:
                                type: integer
                                format: int32
                                x-go-type: uint32
                                minimum: 0
                        namespace:
                          type: string
                          description: pb.QubuiFS.namespace.
                        name:
                          type: string
                          description: pb.QubuiFS.name.
                        des:
                          type: string
                          description: pb.QubuiFS.des.
                        mount_info:
                          type: array
                          description: pb.QubuiFS.mount_info.
                          items:
                            type: object
                            additionalProperties: false
                            description: REST representation of pb.MountInfo.
                            properties:
                              path:
                                type: string
                              node_id:
                                type: string
                            required:
                            - path
                            - node_id
                        meta_service_id:
                          type: array
                          description: Metadata services associated with this QubuiFS.
                          items:
                            type: string
                        data_node_id:
                          type: array
                          description: pb.QubuiFS.data_node_id.
                          items:
                            type: string
                      required:
                      - fs_uuid
                      - namespace
  /qubuifs/{fs_uuid}/mount-info:
    parameters:
    - name: fs_uuid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      tags:
      - QubuiFS
      summary: Add mount info to QubuiFS
      operationId: AddQubuiFSMountInfo
      description: Add one mount record to a QubuiFS. The ControlAdminService implementation
        is a placeholder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
