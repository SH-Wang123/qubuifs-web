          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: integer
                      description: Application status code. Zero means success.
                    message:
                      type: string
                    data:
                      nullable: true
                      description: Operation-specific response payload.
                  required:
                  - code
                  - message
