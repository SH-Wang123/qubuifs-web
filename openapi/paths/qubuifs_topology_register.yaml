parameters:
  - name: fs_uuid
    in: path
    required: true
    schema:
      type: string

post:
  tags:
    - QubuiFS
  summary: Register QubuiFS topology node
  operationId: RegisterQubuiFSTopologyNode
  description: Register one node into the topology of a specific QubuiFS.
  requestBody:
    required: true
    description: Namespace and node_id used to register one node. fs_uuid is taken from the path.
    content:
      application/json:
        schema:
          $ref: '../schemas/qubuifs.yaml#/QubuiFSTopologyNodeRequest'
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/common.yaml#/StandardResponse'
              - type: object
                properties:
                  data:
                    $ref: '../schemas/qubuifs.yaml#/QubuiFSTopologyNodeData'

delete:
  tags:
    - QubuiFS
  summary: Unregister QubuiFS topology node
  operationId: UnregisterQubuiFSTopologyNode
  description: Unregister one node from the topology of a specific QubuiFS.
  requestBody:
    required: true
    description: Namespace and node_id used to unregister one node. fs_uuid is taken from the path.
    content:
      application/json:
        schema:
          $ref: '../schemas/qubuifs.yaml#/QubuiFSTopologyNodeRequest'
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schemas/common.yaml#/StandardResponse'
              - type: object
                properties:
                  data:
                    $ref: '../schemas/qubuifs.yaml#/QubuiFSTopologyNodeData'
