NamespaceCreateRequest:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
    description:
      type: string
  required:
    - name

NamespaceData:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
    description:
      type: string
    filesystem_count:
      type: integer
      minimum: 0
  required:
    - name
    - description
    - filesystem_count

NamespaceListData:
  type: object
  additionalProperties: false
  properties:
    namespaces:
      type: array
      items:
        $ref: '#/NamespaceData'
    count:
      type: integer
      minimum: 0
  required:
    - namespaces
    - count

NamespaceUpdateRequest:
  type: object
  additionalProperties: false
  properties:
    description:
      type: string
  required:
    - description

NamespaceDeleteData:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
  required:
    - name
