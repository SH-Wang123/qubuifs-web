AddDataDeviceRequest:
  type: object
  additionalProperties: false
  description: Device attachment input. Node identity comes from the path; device identity and prefix are returned by the data plane.
  properties:
    phy_path:
      type: string
      minLength: 1
    dev_type:
      type: integer
      format: int32
      x-go-type: uint32
      description: Device transport type. LOCAL=0, TCP=1.
      enum: [0, 1]
    force_init:
      type: boolean
      default: false
  required:
    - phy_path
    - dev_type

AddDataDeviceData:
  type: object
  additionalProperties: false
  description: REST representation of pb.AddDataDeviceResponse.
  properties:
    device_uuid:
      type: string
    qfs_prefix:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    node_id:
      type: string
  required:
    - device_uuid
    - qfs_prefix
    - node_id

DeleteDataDeviceData:
  type: object
  additionalProperties: false
  description: REST representation of pb.DeleteDataDeviceResponse.
  properties:
    code:
      type: integer
      format: int32
    message:
      type: string
  required:
    - code
    - message

DeviceListData:
  type: object
  additionalProperties: false
  description: REST representation of pb.GetDevicesResponse.
  properties:
    node_id:
      type: string
    devices:
      type: array
      items:
        $ref: 'crushnode.yaml#/DeviceInfo'
  required:
    - node_id
    - devices

DeleteDataDeviceRequest:
  type: object
  additionalProperties: false
  description: Optional data-plane lookup hints. node_id and device_uuid come from path parameters.
  properties:
    qfs_prefix:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    phy_path:
      type: string
