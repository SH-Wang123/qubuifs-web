RegisterNodeRequest:
  type: object
  additionalProperties: false
  description: Node registration input. The control plane generates node_id and owns runtime/topology state.
  properties:
    addr:
      type: string
      minLength: 1
      description: Node network address or resolvable host name.
    role:
      type: integer
      format: int32
      x-go-type: uint32
      description: Non-zero bitmask composed from META=1, DATA=2 and CONTROL=4.
      enum: [1, 2, 3, 4, 5, 6, 7]
    parent_node_id:
      type: string
      description: Optional parent topology node. Defaults to the virtual root.
    qdp_port:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 1
      maximum: 65535
    data_rpc_port:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 1
      maximum: 65535
    meta_rpc_port:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 1
      maximum: 65535
    tags:
      type: object
      additionalProperties:
        type: string
    des:
      type: string
    namespace:
      type: string
      description: Optional initial namespace association.
  required:
    - addr
    - role

RegisterNodeData:
  type: object
  additionalProperties: false
  properties:
    node_id:
      type: string
    endpoint:
      type: string
  required:
    - node_id
    - endpoint

NodeListData:
  type: object
  additionalProperties: false
  properties:
    nodes:
      type: array
      items:
        $ref: 'crushnode.yaml#/CrushNode'
    count:
      type: integer
      minimum: 0
  required:
    - nodes
    - count

NodeStatus:
  type: object
  additionalProperties: false
  description: REST representation of pb.NodeStatusResp.
  properties:
    worker_node_id:
      type: string
    worker_node_type:
      type: integer
      format: int32
      description: pb.NodeRole enum value.
      enum: [0, 1, 2, 4]
    session_id:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    ack_seq:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    ts_unix:
      type: integer
      format: int64
    health_status:
      type: integer
      format: int32
      description: pb.HealthStatus enum value.
      enum: [0, 1, 2, 3, 4]
    current_config_version:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    message:
      type: string
  required:
    - worker_node_id
    - health_status
