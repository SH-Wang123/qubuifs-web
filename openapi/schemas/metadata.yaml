ExportMetadataRequest:
  type: object
  additionalProperties: false
  properties:
    dest:
      type: string
  required:
    - dest

ExportMetadataData:
  type: object
  additionalProperties: false
  properties:
    dest:
      type: string
  required:
    - dest

MetaServiceCreateRequest:
  type: object
  additionalProperties: false
  description: Logical metadata service input aligned with pb.MetaService. service_id is generated by the control plane.
  properties:
    fs_uuid_list:
      type: array
      items:
        type: string
        minLength: 1
      uniqueItems: true
    namespace:
      type: array
      items:
        type: string
        minLength: 1
      minItems: 1
      maxItems: 1
      uniqueItems: true
    des:
      type: string
    version:
      type: string
  required:
    - namespace

MetaServiceCreateData:
  type: object
  additionalProperties: false
  properties:
    service_id:
      type: string
  required:
    - service_id

MetaInstanceCreateRequest:
  type: object
  additionalProperties: false
  description: Desired workload for one metadata service instance. service_id is taken from the path and runtime address is assigned by Kubernetes.
  properties:
    image:
      type: string
      minLength: 1
    des:
      type: string
    version:
      type: string

MetaInstanceCreateData:
  type: object
  additionalProperties: false
  properties:
    service_id:
      type: string
    instance_id:
      type: string
  required:
    - service_id
    - instance_id
