CrushNode:
  type: object
  additionalProperties: false
  description: REST representation of pb.CrushNode.
  properties:
    node_id:
      type: string
    type:
      type: integer
      format: int32
      description: pb.NodeType enum value.
      enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    parent_node_id:
      type: string
    children:
      type: array
      items:
        type: string
    weight:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    state:
      type: integer
      format: int32
      description: pb.InOutState enum value.
      enum: [0, 1, 2]
    reweight:
      type: number
      format: double
      minimum: 0
      maximum: 1
    device:
      type: array
      items:
        $ref: '#/DeviceInfo'
    tags:
      type: object
      additionalProperties:
        type: string
    addr:
      type: string
    qdp_port:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    data_rpc_port:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    meta_rpc_port:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    des:
      type: string
    role:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
      description: Bitmask using pb.NodeRole values.
    fs_uuid_list:
      type: array
      items:
        type: string
    version:
      type: string
    namespace:
      type: string
  required:
    - node_id
    - type
    - parent_node_id
    - state
    - addr
    - role

DeviceInfo:
  type: object
  additionalProperties: false
  description: REST representation of pb.DeviceInfo.
  properties:
    device_uuid:
      type: string
    qfs_prefix:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    class:
      type: integer
      format: int32
      description: pb.DeviceClass enum value.
      enum: [0, 1, 2, 3]
    super_block:
      $ref: '#/SuperBlock'
    cap:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    phy_path:
      type: string
    devType:
      type: integer
      format: int32
      x-go-name: DevType
      description: pb.DeviceInfo.devType.
  required:
    - phy_path
    - devType

SuperBlock:
  type: object
  additionalProperties: false
  description: REST representation of pb.SuperBlock.
  properties:
    disk_label:
      $ref: 'qubuifs.yaml#/DiskLabel'
    version:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    magic_num:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    checksum:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    size:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    io_size:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    access:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    block_size:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    dir_len:
      type: integer
      format: int32
      x-go-type: uint32
      minimum: 0
    epoch_head:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
    generation:
      type: integer
      format: int64
      x-go-type: uint64
      minimum: 0
